<!DOCTYPE html>
<html>
<head>
    <title>Media Access Test</title>
</head>
<body>
    <h1>Audio Playback Test</h1>
    <p>Testing direct access to Railway media endpoint:</p>
    
    <audio controls>
        <source src="https://merchtech5-production.up.railway.app/api/media/64/stream" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>
    
    <h2>Console Test</h2>
    <button onclick="testAudioAccess()">Test Audio Access</button>
    <div id="results"></div>
    
    <script>
        async function testAudioAccess() {
            const resultsDiv = document.getElementById('results');
            const audioUrl = 'https://merchtech5-production.up.railway.app/api/media/64/stream';
            
            try {
                console.log('Testing audio URL:', audioUrl);
                
                // Test 1: Fetch HEAD request
                const response = await fetch(audioUrl, { method: 'HEAD' });
                console.log('HEAD request response:', {
                    status: response.status,
                    statusText: response.statusText,
                    headers: Object.fromEntries(response.headers.entries())
                });
                
                // Test 2: Create audio element
                const audio = new Audio();
                audio.crossOrigin = 'anonymous';
                
                audio.addEventListener('loadstart', () => console.log('Audio: loadstart'));
                audio.addEventListener('loadedmetadata', () => console.log('Audio: loadedmetadata'));
                audio.addEventListener('loadeddata', () => console.log('Audio: loadeddata'));
                audio.addEventListener('canplay', () => console.log('Audio: canplay'));
                audio.addEventListener('canplaythrough', () => console.log('Audio: canplaythrough'));
                audio.addEventListener('error', (e) => console.error('Audio error:', e));
                
                audio.src = audioUrl;
                audio.load();
                
                resultsDiv.innerHTML = `
                    <p>✅ HEAD request: ${response.status} ${response.statusText}</p>
                    <p>🎵 Audio element created and loading...</p>
                    <p>Check browser console for detailed logs</p>
                `;
                
            } catch (error) {
                console.error('Test failed:', error);
                resultsDiv.innerHTML = `<p>❌ Error: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
