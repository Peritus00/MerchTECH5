# ClamAV service for malware scanning
# Usage: docker-compose -f docker-compose.clamav.yml up -d
# Set CLAMAV_URL=tcp://localhost:3310 in your app environment

version: '3.8'

services:
  clamav:
    image: clamav/clamav:latest
    container_name: merchtech-clamav
    ports:
      - "3310:3310"
    volumes:
      - clamav-data:/var/lib/clamav
    environment:
      - CLAMAV_NO_FRESHCLAM=false
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "3"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped

volumes:
  clamav-data:
