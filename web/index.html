<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  
  <!-- Favicon Links -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/images/favicon-16x16.png" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/assets/images/favicon.png" />
  
  <title>MerchTrader</title>
  <meta name="description" content="MerchTrader - Your digital marketplace for creators" />
  
  <!-- PWA Manifest (share target support) -->
  <link rel="manifest" href="/manifest.webmanifest" />
  
  <!-- This script tag is generated by @expo/webpack-config -->
  <% preloadLinks %>
  <% css %>
</head>
<body>
  <div id="root"></div>
  <!-- This script tag is generated by @expo/webpack-config -->
  <% scripts %>
  <!-- Service worker for web share target -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/sw.js')
          .then(function(reg) { console.log('[MerchTrader] Service worker registered'); })
          .catch(function(err) { console.warn('[MerchTrader] Service worker registration failed:', err); });
      });
    }
  </script>
</body>
</html>
